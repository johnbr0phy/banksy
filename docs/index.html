<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banksy Print Tracker - Upcoming Auctions</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>Banksy Print Tracker</h1>
      <p class="tagline">Tracking original Banksy print auctions worldwide</p>
      <nav>
        <a href="index.html" class="active">Upcoming Auctions</a>
        <a href="completed.html">Completed Auctions</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="meta-bar">
      <div class="meta-left">
        <span id="last-updated">Loading...</span>
        <span id="lot-count"></span>
      </div>
      <div class="currency-toggle" id="currency-toggle" hidden>
        <span class="filter-label">Show prices in</span>
        <div class="currency-pills" role="group" aria-label="Display currency for all lots">
          <button type="button" class="currency-pill is-active" data-currency="ORIGINAL">Original</button>
          <button type="button" class="currency-pill" data-currency="GBP">£ GBP</button>
          <button type="button" class="currency-pill" data-currency="USD">$ USD</button>
          <button type="button" class="currency-pill" data-currency="EUR">€ EUR</button>
          <button type="button" class="currency-pill" data-currency="CHF">CHF</button>
          <button type="button" class="currency-pill" data-currency="HKD">HKD</button>
          <button type="button" class="currency-pill" data-currency="CNY">¥ CNY</button>
        </div>
        <span id="fx-note" class="fx-note" hidden></span>
      </div>
    </div>

    <div class="filter-bar" id="filter-bar" style="display:none;">
      <label class="filter-label" for="print-filter">Print name</label>
      <div class="filter-controls">
        <input
          type="search"
          id="print-filter"
          class="filter-input"
          placeholder="Filter by print name (e.g. Girl with Balloon)"
          list="print-name-suggestions"
          autocomplete="off"
        />
        <button type="button" id="print-filter-clear" class="filter-clear" hidden>
          Clear
        </button>
      </div>
      <datalist id="print-name-suggestions"></datalist>
    </div>

    <div id="auction-table-container">
      <div class="loading" id="loading">Loading auction data...</div>
      <div class="empty-state" id="empty-state" style="display:none;">
        No upcoming auctions found. Check back soon.
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Banksy Print Tracker. Data sourced from public auction listings.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
